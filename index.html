<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d12"><meta name="description" content="CHATS private messaging"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="css/style.css"><title>CHATS</title></head><body>
<div id="toast" class="toast"></div>
<section id="authView" class="auth-view"><div class="auth-card"><div class="brand-mark">C</div><h1>CHATS</h1><p class="muted">Private messaging, made simple.</p><div class="tabs"><button class="tab active" data-auth="login">Login</button><button class="tab" data-auth="signup">Create account</button></div><form id="authForm"><label>Email</label><input id="email" type="email" placeholder="you@example.com" required><label>Password</label><input id="password" type="password" placeholder="••••••••" minlength="6" required><input id="displayName" class="signup-only hidden" type="text" placeholder="Your name"><button class="primary" type="submit" id="authButton">Login</button></form></div></section>
<main id="appView" class="app hidden"><aside class="sidebar"><header class="side-head"><div><div class="eyebrow">PRIVATE MESSAGING</div><h2>CHATS</h2></div><div class="head-actions"><span id="unreadBadge" class="unread-badge hidden">0</span><button id="logoutBtn" class="icon-btn" title="Logout">↪</button></div></header><div class="profile-mini" id="myProfileBtn"><div class="avatar-wrap"><div id="myAvatar" class="avatar">M</div><span id="myOnlineDot" class="online-dot"></span></div><div class="profile-copy"><strong id="myName">You</strong><span id="myEmail"></span></div><span class="profile-arrow">›</span></div><div class="search-wrap"><input id="userSearch" placeholder="Search people..." autocomplete="off"></div><div id="userList" class="user-list"></div><nav class="bottom-nav"><button id="usersNav" class="nav-btn active">👥<span>Users</span></button><button id="profileNav" class="nav-btn">⚙<span>Profile</span></button></nav></aside>
<section class="chat"><div id="emptyChat" class="empty-chat hidden"></div><div id="chatPanel" class="chat-panel hidden"><header class="chat-head"><button id="backBtn" class="back-btn" aria-label="Back">‹</button><div class="avatar-wrap"><div id="chatAvatar" class="avatar">A</div><span id="chatOnlineDot" class="online-dot hidden"></span></div><div class="chat-title"><strong id="chatName">Person</strong><span id="chatStatus">Offline</span></div></header><div id="messages" class="messages"></div><form id="messageForm" class="composer"><input id="messageInput" maxlength="2000" autocomplete="off" placeholder="Write a message..."><button class="send-btn" type="submit">➤</button></form></div></section></main>
<div id="settingsModal" class="modal hidden"><div class="modal-card"><div class="modal-head"><div><div class="eyebrow">ACCOUNT</div><h2>Profile settings</h2></div><button id="closeSettings" class="icon-btn">×</button></div><div class="settings-section"><h3>Profile</h3><div class="profile-editor"><div class="avatar-wrap big"><div id="settingsAvatar" class="avatar">M</div></div><div><label class="upload-label">Change profile picture<input id="avatarInput" type="file" accept="image/*" hidden></label><button id="removeAvatar" class="secondary-btn" type="button">Remove picture</button></div></div><label>Name</label><input id="settingsName" maxlength="50" placeholder="Your name"><button id="saveProfile" class="primary small-btn">Save profile</button></div><div class="settings-section"><h3>Theme</h3><div class="theme-grid"><button data-theme="dark" class="theme-choice">Dark</button><button data-theme="light" class="theme-choice">Light</button><button data-theme="purple" class="theme-choice">Purple</button><button data-theme="blue" class="theme-choice">Blue</button><button data-theme="green" class="theme-choice">Green</button></div></div><div class="settings-section"><h3>Notifications</h3><div class="notif-row"><div><strong id="notifStatus">Notifications off</strong><p class="tiny">Control message alerts on this device.</p></div><button id="toggleNotifications" class="secondary-btn" type="button">Enable</button></div></div><div class="settings-section"><h3>Password</h3><input id="newPassword" type="password" minlength="6" placeholder="New password"><button id="changePassword" class="primary small-btn">Change password</button></div><div class="settings-section"><button id="settingsLogout" class="danger-btn" type="button">Log out</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/app.js"></script></body></html>
