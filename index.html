<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MoxoChat</title>
  <meta name="description" content="Private personal messaging">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="toast" class="toast"></div>

  <section id="authView" class="auth-view">
    <div class="auth-card">
      <div class="brand-mark">M</div>
      <h1>MoxoChat</h1>
      <p class="muted">Private messaging, made simple.</p>

      <div class="tabs">
        <button class="tab active" data-auth="login">Login</button>
        <button class="tab" data-auth="signup">Create account</button>
      </div>

      <form id="authForm">
        <label>Email</label>
        <input id="email" type="email" placeholder="you@example.com" required>
        <label>Password</label>
        <input id="password" type="password" placeholder="••••••••" minlength="6" required>
        <input id="displayName" class="signup-only hidden" type="text" placeholder="Your name">
        <button class="primary" type="submit" id="authButton">Login</button>
      </form>
      <p class="tiny">Your messages are stored in your Supabase project.</p>
    </div>
  </section>

  <main id="appView" class="app hidden">
    <aside class="sidebar">
      <header class="side-head">
        <div>
          <div class="eyebrow">MESSAGES</div>
          <h2>MoxoChat</h2>
        </div>
        <button id="logoutBtn" class="icon-btn" title="Logout">↪</button>
      </header>

      <div class="profile-mini">
        <div id="myAvatar" class="avatar">M</div>
        <div class="profile-copy">
          <strong id="myName">You</strong>
          <span id="myEmail"></span>
        </div>
      </div>

      <div class="search-wrap">
        <input id="userSearch" placeholder="Search people..." autocomplete="off">
      </div>
      <div id="userList" class="user-list"></div>
    </aside>

    <section class="chat">
      <div id="emptyChat" class="empty-chat">
        <div class="empty-icon">✦</div>
        <h3>Select a person</h3>
        <p>Choose someone from the left to start a private conversation.</p>
      </div>

      <div id="chatPanel" class="chat-panel hidden">
        <header class="chat-head">
          <div id="chatAvatar" class="avatar">A</div>
          <div>
            <strong id="chatName">Person</strong>
            <span id="chatStatus">Private chat</span>
          </div>
        </header>

        <div id="messages" class="messages"></div>

        <form id="messageForm" class="composer">
          <input id="messageInput" maxlength="2000" autocomplete="off" placeholder="Write a message...">
          <button class="send-btn" type="submit">➤</button>
        </form>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
