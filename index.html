<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>CHATS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">CHATS</div>
    <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙</button>
  </header>

  <main id="home" class="screen">
    <div class="search-wrap"><input id="search" placeholder="Search people"></div>
    <div id="users" class="users"></div>
    <div id="emptyUsers" class="empty hidden">No users yet</div>
  </main>

  <main id="chat" class="screen chat-screen hidden">
    <div class="chat-head">
      <button id="backBtn" class="icon-btn">‹</button>
      <div>
        <div id="chatName" class="chat-name">Chat</div>
        <div id="chatStatus" class="chat-status"></div>
      </div>
    </div>
    <div id="messages" class="messages"></div>
    <form id="sendForm" class="composer">
      <input id="messageInput" autocomplete="off" maxlength="2000" placeholder="Message">
      <button class="send" type="submit">➤</button>
    </form>
  </main>

  <section id="settings" class="sheet hidden">
    <div class="sheet-inner">
      <div class="sheet-head"><b>Profile</b><button id="closeSettings" class="icon-btn">×</button></div>
      <label>Your name</label>
      <input id="nameInput" maxlength="40" placeholder="Your name">
      <button id="saveName" class="primary">Save name</button>

      <label>Theme</label>
      <div class="themes">
        <button data-theme="dark">Dark</button>
        <button data-theme="light">Light</button>
        <button data-theme="blue">Blue</button>
        <button data-theme="purple">Purple</button>
        <button data-theme="green">Green</button>
      </div>

      <button id="notifyBtn" class="secondary">Enable notifications</button>
      <p id="statusText" class="small"></p>
    </div>
  </section>
</div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
